<!doctype html>

<html lang="en">

<head>

  <meta charset="UTF-8" />


  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />


  <meta
    name="description"
    content="Ecommerce React application for browsing products, searching, filtering, favorites and shopping cart."
  />


  <title>
    Ecommerce
  </title>


  <!-- ==================================================
       GITHUB PAGES SPA ROUTING
       ================================================== -->

  <script>

    /*
      If 404.html redirected us here
      with a route stored after ?/,
      restore the original React URL
      before React starts.
    */

    (function () {

      var locationObject =
        window.location;


      if (
        locationObject.search[1] === '/'
      ) {

        var decoded =
          locationObject.search
            .slice(1)
            .split('&')
            .map(function (part) {

              return part.replace(
                /~and~/g,
                '&'
              );

            })
            .join('?');


        window.history.replaceState(
          null,
          '',
          locationObject.pathname
            .slice(
              0,
              -1
            ) +
          decoded +
          locationObject.hash
        );

      }

    })();

  </script>

</head>


<body>


  <div id="root"></div>


  <script
    type="module"
    src="/src/main.jsx"
  ></script>


</body>

</html>
